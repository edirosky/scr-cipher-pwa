<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00050c">
  <title>Offline — SCR CIPHER</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #00050c 0%, #0a1520 100%);
      color: #c8daf0;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      padding: 24px;
    }
    .card {
      border: 2px solid #00c8ff;
      border-radius: 6px;
      background: #06101a;
      padding: 32px;
      max-width: 420px;
      text-align: center;
    }
    .hex { font-size: 44px; color: #00c8ff; margin-bottom: 12px; }
    h1 { font-size: 18px; letter-spacing: 3px; color: #00c8ff; margin-bottom: 14px; }
    p { font-size: 12px; line-height: 1.8; color: #7a90a8; margin-bottom: 22px; }
    .btn {
      display: inline-block;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 2px;
      padding: 12px 24px;
      border: 2px solid #ff6b35;
      color: #ff6b35;
      background: transparent;
      text-decoration: none;
      border-radius: 6px;
    }
    .btn:active { background: #ff6b35; color: #00050c; }
  </style>
</head>
<body>
  <div class="card">
    <div class="hex">⬡</div>
    <h1>SCR CIPHER · OFFLINE</h1>
    <p>
      O aplicativo ainda não foi carregado neste dispositivo.<br><br>
      Conecte-se à internet uma vez para instalar o app shell — depois o
      codificador, o descodificador e o mapa offline funcionam sem rede.
    </p>
    <a class="btn" href="./index.html">↻ TENTAR NOVAMENTE</a>
  </div>
</body>
</html>
